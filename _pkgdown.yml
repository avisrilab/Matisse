url: https://avisrilab.github.io/Matisse

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#2C6E8A"
    heading-font: "Lato"
    base-font-size: "1rem"
    container-max-width: "100%"

home:
  title: "Matisse — Splicing and chromatin, one cell at a time"
  description: >
    Matisse adds isoform-resolved splicing and chromatin accessibility
    layers to your Seurat/Signac workflow. For each cell, measure which
    transcript isoform is being made and compare that directly with
    chromatin accessibility at the same loci — all within one object,
    on the same UMAP, across the same clusters.
    Works with 10x Chromium (STARsolo junction counts), long-read
    isoform data (Bagpiper, FLAMES, LIQA), and 10x Multiome / Signac
    for paired ATAC + RNA.
  links:
    - text: GitHub repository
      href: https://github.com/avisrilab/Matisse
    - text: Report an issue
      href: https://github.com/avisrilab/Matisse/issues

navbar:
  structure:
    left:  [intro, install, getting-started, articles, reference, news]
    right: [search, github]
  components:
    install:
      text: Install
      href: index.html#installation
    getting-started:
      text: Getting Started
      href: articles/intro.html
    articles:
      text: Vignettes
      menu:
        - text: Long-read workflow (transcript counts)
          href: articles/long-reads.html
        - text: Short-read workflow (junction counts)
          href: articles/short-reads.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/avisrilab/Matisse
      aria-label: GitHub

reference:
  - title: "Creating a Matisse object"
    desc: >
      Start here. This function combines your Seurat object with splicing
      data into a single Matisse object (and computes PSI) in one call.
      Pass <code>junction_counts</code> for short-read (junction) mode, or
      <code>transcript_counts</code> for long-read (transcript) mode, plus
      splice events via <code>events</code> (data.frame or path to a SUPPA2
      <code>.ioe</code> file).
    contents:
      - MatisseObject-class
      - CreateMatisseObject

  - title: "Short-read input (STARsolo)"
    desc: >
      Helpers for the short-read (junction) workflow. <code>ReadSTARsoloSJ</code>
      loads a STARsolo <code>SJ</code> matrix and relabels its junctions into
      the <code>chr-start-end-strand</code> IDs Matisse expects.
      <code>BuildJunctionEvents</code> turns SUPPA2 <code>.ioe</code> events
      into a junction-ID event table whose features match those junctions —
      a deterministic coordinate adapter, not a heuristic event caller.
    contents:
      - ReadSTARsoloSJ
      - BuildJunctionEvents

  - title: "Long-read input (transcript counts)"
    desc: >
      Helper for the long-read (transcript) workflow.
      <code>ReadTranscriptMatrix</code> loads a 10x-style MatrixMarket
      triplet from a long-read / isoform quantifier (Bagpiper, FLAMES,
      LIQA), auto-detects orientation, and returns a transcripts × cells
      matrix with optional version-suffix stripping so the IDs match a
      SUPPA2 <code>.ioe</code> event annotation.
    contents:
      - ReadTranscriptMatrix

  - title: "Retrieve or update your data"
    desc: >
      Matisse-specific accessors. For raw count and annotation matrices,
      use the native Seurat API on the embedded Seurat object: e.g.
      <code>SeuratObject::GetAssayData(GetSeurat(obj)[["isoform"]], "counts")</code>
      for junction or transcript counts, or
      <code>GetSeurat(obj)[["psi"]][[]]</code> for the per-event annotation
      table.
    contents:
      - GetSeurat
      - GetPSI
      - SetPSI
      - MatisseMeta
      - "MatisseMeta<-"

  - title: "Normalisation"
    desc: >
      <code>SCTransform</code> applies variance stabilisation and scales for
      sequencing depth -- in transcript mode it targets the
      <code>isoform</code> assay automatically; in junction mode it targets
      the gene-expression assay. For log-normalisation alternatives
      (<code>NormalizeData</code>, <code>ScaleData</code>,
      <code>FindVariableFeatures</code>) use Seurat's functions on the
      embedded Seurat object via the <code>$</code> operator
      (<code>obj$NormalizeData(...)</code>) or
      <code>GetSeurat(obj)</code>.
    contents:
      - SCTransform.MatisseObject

  - title: "Dimensionality reduction"
    desc: >
      Reduce the high-dimensional feature space to a compact representation
      before clustering and visualisation. <code>RunPCA</code> is the standard
      route after <code>SCTransform</code>; <code>RunSVD</code> (LSI) is used
      for ATAC-seq data in multiome experiments.
    contents:
      - RunPCA.MatisseObject
      - RunUMAP.MatisseObject

  - title: "Clustering and differential expression"
    desc: >
      Group cells by transcriptional state and identify marker genes.
      All functions operate on the embedded Seurat object and return the
      updated <code>MatisseObject</code> — except <code>FindMarkers</code>,
      which returns a data frame.
    contents:
      - FindNeighbors.MatisseObject
      - FindClusters.MatisseObject
      - FindMarkers.MatisseObject

  - title: "Metadata and assay selection"
    desc: >
      Add or update per-cell metadata columns. New columns are accessible
      immediately via <code>MatisseMeta()</code> and the <code>$</code>
      operator. <code>DefaultAssay</code> picks which assay
      (<code>"RNA"</code>, <code>"isoform"</code>, <code>"psi"</code>, …)
      Seurat operations target by default.
    contents:
      - AddMetaData.MatisseObject
      - DefaultAssay.MatisseObject

  - title: "Signac / ATAC-seq methods"
    desc: >
      For multiome (paired ATAC + RNA) datasets. <code>RunTFIDF</code>
      normalises peak counts; <code>FindTopFeatures</code> selects variable
      peaks; <code>RunSVD</code> performs Latent Semantic Indexing (LSI) —
      the ATAC equivalent of PCA.
    contents:
      - RunTFIDF.MatisseObject
      - FindTopFeatures.MatisseObject
      - RunSVD.MatisseObject

  - title: "Calculate splicing ratios (PSI)"
    desc: >
      Compute PSI (Percent Spliced In) -- the fraction of transcripts in each
      cell that include a given exon. Values range from 0 (exon always skipped)
      to 1 (exon always included). <code>CreateMatisseObject()</code> calls
      <code>CalculatePSI()</code> automatically; you only call it directly to
      recompute with different parameters (e.g. <code>min_coverage</code>) or
      after constructing with <code>defer_psi = TRUE</code>.
    contents:
      - CalculatePSI
      - SummarizePSI

  - title: "Quality control and filtering"
    desc: >
      Identify and remove cells or splicing events that don't have enough
      data for reliable analysis. QC columns written automatically:
      <code>nCount_isoform</code> and <code>nFeature_isoform</code> at
      construction; <code>nPercent_isoform</code> after CalculatePSI().
    contents:
      - FilterCells
      - FilterEvents

  - title: "Visualisation"
    desc: >
      Plot splicing patterns across your cells. Overlay any feature — PSI
      values, junction counts, or gene expression — on a UMAP, compare
      splicing between cell types, or inspect junction usage for a gene
      of interest. Pass the feature name via the <code>feature</code>
      argument.
    contents:
      - PlotUMAP
      - PlotViolin
      - PlotHeatmap
      - PlotSashimi

  - title: "Utilities"
    desc: >
      Helper functions for combining datasets.
    contents:
      - MergeMatisse

articles:
  - title: "Vignettes"
    navbar: "Vignettes"
    contents:
      - intro
      - long-reads
      - short-reads

